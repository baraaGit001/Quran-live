# Static server for the Quran live site. Runs in its own container on
# 127.0.0.1:8096; pricelens-proxy terminates TLS for quran.run.place and
# forwards here. Nothing is proxied out of this container and nothing is
# writable inside it -- it only hands out files the streamer has already
# written to ~/quran-live/site.

server {
    listen 80;
    server_name _;

    root /srv/site;
    index index.html;

    access_log off;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types application/vnd.apple.mpegurl application/json application/javascript text/css;

    # The media playlist is rewritten every few seconds and is the one file a
    # cache must never hold: a stale playlist points at segments that have
    # already been deleted, which a player reports as a dead stream.
    location ~* \.m3u8$ {
        add_header Cache-Control "no-cache, no-store" always;
        types { } default_type application/vnd.apple.mpegurl;
    }

    # Segments are immutable once written and live only as long as the sliding
    # window, so a short cache is safe and saves the disk a re-read when
    # several viewers are a few seconds apart.
    location ~* \.ts$ {
        add_header Cache-Control "public, max-age=30" always;
        types { } default_type video/mp2t;
    }

    # Every .json here is live configuration -- the stream status, the reciter
    # list, the support details -- and all of it is small. The rule used to
    # name status.json alone, which meant a change to support.json or
    # channels.json sat in browser caches showing details that had been edited
    # or removed, with nothing on the server to indicate why.
    location ~* \.json$ {
        add_header Cache-Control "no-cache, no-store" always;
        default_type application/json;
    }

    # The page and the player library change only on deploy.
    location ~* \.(js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Directory listings would expose the whole segment window and the internal
    # layout; there is nothing under /live a viewer should browse.
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }
}

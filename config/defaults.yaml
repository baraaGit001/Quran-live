# Defaults inherited by every channel. A channel file overrides only what it needs.
# Tuned for a 2-OCPU ARM server with NO hardware video encoder: the video is
# pre-encoded once and stream-copied, so these encode settings apply only to the
# one-off pre-render, not to the 24/7 stream.

video:
  width: 1280
  height: 720
  fps: 30
  # 2 Mbps was chosen when every background was one still held for the whole
  # recitation -- the easiest thing H.264 will ever be asked to compress. The
  # backgrounds move now, and the comment that lived here said in as many
  # words that a fast-moving scene would not survive that bitrate. It did not.
  # It still matters at scale: the full mujawwad Quran is ~81 hours, so every
  # extra Mbps is ~37 GB on disk and ~0.35 TB/month of egress per channel.
  bitrate: "3500k"
  # x264 preset for the final track. Rendering is a one-off per recitation and
  # already slower than realtime, so a step down from veryfast buys real
  # quality for time that is spent once.
  preset: "faster"
  # Quality of the intermediate rotation segments, as x264 CRF. These are not
  # broadcast; they are re-encoded into every track that uses them. Giving them
  # a bitrate as low as the output's meant two lossy generations stacked on top
  # of each other, which is most of what went wrong. Near-transparent here
  # costs disk once and nothing on air.
  segment_crf: 16
  # How a source that is not 16:9 fills the frame: blur | crop | pad
  fit: "blur"
  # Seconds per still image when building a loop out of images.
  image_duration: 20
  # Seconds one still stays on screen before the pool moves to the next. A
  # long surah is otherwise two hours of one unchanging frame. 0 holds a
  # single image for the whole track. Videos ignore this and play out fully.
  visual_rotate_seconds: 300
  # Keyframe interval in seconds. YouTube wants <= 4s; 2s reconnects faster.
  keyframe_interval: 2

audio:
  bitrate: "128k"
  sample_rate: 44100
  channels: 2

selection:
  # Don't replay anything still inside the recent-history window.
  history_size: 10
  shuffle: true

overlay:
  enabled: true
  font_size: 54
  color: "#FFFFFF"
  # Soft shadow keeps text legible over any background without a heavy box.
  shadow: true
  position: "bottom"
  margin: 80

stream:
  # Seconds to wait before relaunching ffmpeg after it exits.
  restart_delay: 5
  # Give up and alert only after this many consecutive rapid failures.
  max_rapid_failures: 10

cache:
  # Hard ceiling on rendered tracks. The full Quran at 2 Mbps is ~73 GB; this
  # box has ~145 GB free and also runs two web apps, so the cache is bounded
  # and evicts least-recently-used tracks rather than being trusted to behave.
  max_gb: 60
  # Never let the disk drop below this, whatever the cache limit says.
  min_free_gb: 10

# One channel = one YouTube Live stream. Copy this file to add another.
name: "channel01"
title: "القرآن الكريم • المصحف المجود • الشيخ محمد صديق المنشاوي"
enabled: true

# Shown in the reciter picker on the website. Kept separate from overlay.text
# (which is burned into the video and sized for a 1280px frame) so the name on
# the site can be changed without re-rendering a single track.
reciter: "محمد صدّيق المنشاوي"
style: "المصحف المجوّد"

# Audio and visuals are deliberately unrelated pools. The engine picks from each
# independently: the recitation playing has no bearing on what is on screen.
audio_dir: "assets/audio/minshawi"
visual_dir: "assets/visuals"

# Name of the env var holding this channel's YouTube key. The key itself never
# appears in this file, so channel configs stay safe to commit.
stream_key_env: "CHANNEL01_STREAM_KEY"

stream:
  # hls = publish to our own website. youtube | facebook | twitch push to a
  # platform instead and need stream_key_env set.
  #
  # This channel is hls because the YouTube channel took a strike: a platform
  # can end the broadcast at any moment and there is nothing in this codebase
  # that can prevent it. Serving the segments ourselves means the recitation
  # stops only when we stop it.
  platform: "hls"

# Any .ttf in assets/fonts. Swap the file, rebuild, and the caption restyles.
font: "assets/fonts/ArefRuqaa-Regular.ttf"

overlay:
  enabled: true
  text: "الشيخ محمد صديق المنشاوي"
  font_size: 56
  color: "#FFFFFF"
  position: "bottom"
  margin: 70

video:
  width: 1280
  height: 720
  fps: 30
  bitrate: "3500k"
  # crop | blur | pad | auto  -- see engine/prerender.py
  fit: "crop"
  image_duration: 20

  # مؤقتًا: التدوير مُطفأ أثناء إعادة بناء المقاطع
  visual_rotate_seconds: 0
